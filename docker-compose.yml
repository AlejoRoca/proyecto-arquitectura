services:
  api:
    build: ./api
    env_file:
      - .env
    depends_on:
      - db

  web:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html
      - ./web/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: alejo
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: empresa
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alejo -d empresa"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:

